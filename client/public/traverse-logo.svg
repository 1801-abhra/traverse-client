<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4d5a"/>
      <stop offset="100%" style="stop-color:#b01020"/>
    </linearGradient>
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6070"/>
      <stop offset="50%" style="stop-color:#e63946"/>
      <stop offset="100%" style="stop-color:#8a0e18"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tShadow">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#e63946" flood-opacity="0.5"/>
    </filter>
    <radialGradient id="circleGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#e63946;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#e63946;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect x="20" y="20" width="360" height="360" rx="60" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="360" height="360" rx="60" fill="url(#circleGlow)"/>
  <rect x="20" y="20" width="360" height="360" rx="60" fill="none" stroke="url(#redGrad)" stroke-width="4"/>
  <rect x="28" y="28" width="344" height="344" rx="54" fill="none" stroke="#e63946" stroke-width="1" opacity="0.3"/>
  <circle cx="200" cy="200" r="138" fill="none" stroke="url(#redGrad)" stroke-width="5" filter="url(#glow)"/>
  <circle cx="200" cy="200" r="128" fill="none" stroke="#e63946" stroke-width="1" opacity="0.25"/>
  <path d="M108,148 L292,148 L292,172 L214,172 L214,288 L186,288 L186,172 L108,172 Z" fill="#5a080f" transform="translate(4,6)"/>
  <path d="M108,148 L292,148 L292,172 L214,172 L214,288 L186,288 L186,172 L108,172 Z" fill="url(#tGrad)" filter="url(#tShadow)"/>
  <path d="M108,148 L292,148 L292,162 L108,162 Z" fill="url(#shineGrad)"/>
  <path d="M186,172 L200,172 L200,230 L186,230 Z" fill="url(#shineGrad)"/>
  <line x1="100" y1="258" x2="152" y2="258" stroke="url(#redGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="100" y1="270" x2="136" y2="270" stroke="#e63946" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="100" y1="282" x2="120" y2="282" stroke="#e63946" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <circle cx="62" cy="62" r="3" fill="#e63946" opacity="0.5"/>
  <circle cx="338" cy="62" r="3" fill="#e63946" opacity="0.5"/>
  <circle cx="62" cy="338" r="3" fill="#e63946" opacity="0.5"/>
  <circle cx="338" cy="338" r="3" fill="#e63946" opacity="0.5"/>
  <circle cx="200" cy="200" r="138" fill="none" stroke="#e63946" stroke-width="2" opacity="0">
    <animate attributeName="r" values="138;162;138" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="2;0.5;2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="200" r="150" fill="none" stroke="#e63946" stroke-width="1.2" stroke-dasharray="6 18" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="10s" repeatCount="indefinite"/>
  </circle>
</svg>